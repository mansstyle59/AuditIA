name: Deploy AuditIA site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: auditia-pages-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate app before publishing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess, tempfile

          root = Path("site")
          html_path = root / "index.html"
          html = html_path.read_text(encoding="utf-8")
          scripts = re.findall(r"<script\\b([^>]*)>([\\s\\S]*?)</script>", html, re.I)
          inline = [(attrs, body) for attrs, body in scripts if not re.search(r"\\bsrc\\s*=", attrs, re.I)]
          if not inline:
              raise SystemExit("No inline JavaScript found in site/index.html")
          with tempfile.TemporaryDirectory() as tmp:
              for i, (_, body) in enumerate(inline, 1):
                  js = Path(tmp) / f"inline-{i}.js"
                  js.write_text(body, encoding="utf-8")
                  subprocess.run(["node", "--check", str(js)], check=True)
          json.loads((root / "manifest.webmanifest").read_text(encoding="utf-8"))
          sw = (root / "sw.js").read_text(encoding="utf-8")
          assets_block = re.search(r"const ASSETS\\s*=\\s*\\[([\\s\\S]*?)\\];", sw)
          if not assets_block:
              raise SystemExit("Service-worker ASSETS list not found")
          assets = re.findall(r"['\\\"]([^'\\\"]+)['\\\"]", assets_block.group(1))
          missing = [asset for asset in assets if asset not in ("./",) and not (root / asset.removeprefix("./")).is_file()]
          if missing:
              raise SystemExit("Missing service-worker assets: " + ", ".join(missing))
          print(f"Validation OK: {len(inline)} inline scripts, manifest JSON and {len(assets)} service-worker assets.")
          PY
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
