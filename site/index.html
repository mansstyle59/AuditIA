    a{color:inherit}.wrap{width:min(1120px,100% - 40px);margin:auto}.top{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12}.brand{display:flex;align-items:center;gap:12px;text-decoration:none}.brand img{width:42px;height:42px}.brand strong{display:block;font-size:18px;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase}.toplink{font-size:13px;text-decoration:none;color:var(--muted)}

    /* ===== Bannière d'alerte clé API + écran de chargement connexion ===== */

    /* ===== Bannière des commerces autour de moi ===== */
    .nearby-banner{position:relative;overflow:hidden;margin:20px 0 28px;padding:22px;border:1px solid #7969b7;border-radius:22px;background:radial-gradient(ellipse at 100% 0%,#6250a555,transparent 48%),linear-gradient(135deg,#30294f,#24213b);box-shadow:0 16px 40px #09071535}

    /* ===== AuditIA UX uplift: competitor-informed, preserving current flows ===== */
    :root{
      --ai-bg:#100f25;--ai-surface:#1b1a35;--ai-surface-2:#242241;
      --ai-line:#383557;--ai-accent:#a68aff;--ai-good:#6fe0b4;
      --ai-warn:#ffd27a;--ai-danger:#ff929e;
    }
    .workspace-app{color:var(--text)}
    .app-panel,.app-stat{border-color:var(--ai-line)}
    .app-panel h2,.app-panel h3{letter-spacing:-.3px}
    .app-muted,.app-panel p{line-height:1.55}
    .app-btn{transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}
    .app-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
    .app-btn:focus-visible,.ac-input:focus-visible,.app-filter:focus-visible{outline:3px solid #a68aff99;outline-offset:2px}
    .place-search{position:relative;overflow:visible;padding:clamp(17px,3vw,24px)!important;
      background:radial-gradient(ellipse at 100% 0%,#7657ed20,transparent 45%),linear-gradient(145deg,#201e3c,#19172f)!important;
      border-color:#66578f!important;box-shadow:0 15px 38px #05041135}
    .place-search:before{content:"";display:block;width:42px;height:4px;border-radius:99px;background:linear-gradient(90deg,#a68aff,#ffad72);margin-bottom:16px}
    .place-search h2{font-size:clamp(20px,3vw,26px)!important;line-height:1.2}
    .place-search .app-muted{max-width:62ch}
    .ac-wrap{margin-top:12px}
    .ac-input{min-height:56px;padding:15px 48px 15px 16px;background:#121128;border-color:#5d5683;
      border-radius:15px;box-shadow:inset 0 1px 0 #ffffff08;font-size:16px}
    .ac-input:focus{outline:3px solid #a68aff38;border-color:#a68aff}
    .ac-list{gap:7px;margin-top:9px}
    .ac-item{padding:13px 14px;border-radius:13px;background:#282543;border-color:#49446b;transition:background .15s,border-color .15s,transform .15s}
    .ac-item:hover{background:#332d53;border-color:#8e79db;transform:translateY(-1px)}
    .ac-item b{font-size:14px}.ac-item small{font-size:12px;line-height:1.45}
    .ac-msg{padding:12px 2px}
    .nearby-banner{border-color:#594d86;background:radial-gradient(ellipse at 100% 0%,#7657ed26,transparent 48%),linear-gradient(135deg,#201d3c,#15142b);box-shadow:0 16px 38px #05041130}
    .nearby-banner h2{letter-spacing:-.6px}
    .nearby-card{background:#ffffff06;border-color:#ffffff17}
    .nearby-card:hover{border-color:#8b78d5;background:#ffffff0a}
    .app-content-title{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:4px 0 16px}
    .app-content-title h2{font-size:clamp(22px,3vw,28px);letter-spacing:-.8px;margin:0}
    .app-content-title p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .app-stat{background:linear-gradient(145deg,#252343,#1b1a33);box-shadow:0 7px 22px #06051518}
    .app-stat strong{letter-spacing:-1.2px}
    .app-row{transition:border-color .15s,background .15s}
    .app-row:hover{border-color:#6c5aa0;background:#393451}
    .info-row{align-items:flex-start}
    .info-row span{white-space:normal}
    .info-row b{font-weight:750}
    @media(max-width:640px){
      .place-search{padding:17px!important;border-radius:18px!important}
      .ac-input{min-height:54px}
      .app-content-title{align-items:flex-start;flex-direction:column}
      .nearby-card{padding:11px}
    }
    @media(prefers-reduced-motion:reduce){
      .app-btn,.ac-item,.app-row{transition:none!important}
      html{scroll-behavior:auto}
    }

    /* ===== Recherche automatique de commerces (Google Places) ===== */
    .place-search{margin-bottom:14px}
    .ac-wrap{position:relative;margin-top:6px}
    .ac-input{width:100%;border:1px solid #565472;background:#2f2d40;color:#f5f3fb;border-radius:13px;padding:14px 15px;min-height:50px;font-size:16px}
    .ac-input:focus{outline:2px solid #8268ff80;border-color:#8268ff}
    .ac-list{display:grid;gap:6px;margin-top:8px}
    .ac-item{display:block;width:100%;text-align:left;background:#403e56;border:1px solid #524f6c;border-radius:12px;padding:12px 13px;cursor:pointer;color:#f3f2f8}
    .ac-item:hover{background:#4a4866;border-color:#6a6790}
    .ac-item b{display:block;font-size:14px;line-height:1.3}
    .ac-item small{display:block;color:#bdb9cc;font-size:12px;margin-top:2px;overflow-wrap:anywhere}
    .ac-msg{font-size:12.5px;color:#bdb9cc;padding:8px 2px;line-height:1.5}
    .ac-msg.err{color:#ffb4bd}
    .place-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
    .place-form input{flex:1;min-width:160px;border:1px solid #5b5b7e;background:#3a3858;color:#f5f3fb;border-radius:13px;padding:13px 14px;min-height:48px}
    .place-form .app-btn{min-height:48px;white-space:nowrap}
    .place-msg{font-size:12.5px;color:#cdbffb;background:#453f6c;border:1px solid #675f95;border-radius:12px;padding:10px 12px;margin:10px 0 0;line-height:1.5}
    .place-results{display:grid;gap:8px;margin-top:10px}
    .place-card{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#42445e;border:1px solid #ffffff10;border-radius:14px;padding:12px}
    .place-info{min-width:0}.place-info b{font-size:14px;line-height:1.3}.place-info small{display:block;color:#aaa6bd;font-size:11.5px;line-height:1.4;overflow-wrap:anywhere}
    .place-card .app-btn{flex:0 0 auto;min-height:40px}
    .place-picked{font-size:12.5px;color:#9ae8c4;margin:10px 0 0;line-height:1.5}
    .place-clear{background:none;border:0;color:#ffb4bd;text-decoration:underline;font-weight:700;cursor:pointer;padding:0;font-size:12.5px}
    .info-panel{margin-top:14px}
    .info-grid{display:grid;gap:8px}
    .info-row{display:flex;justify-content:space-between;gap:10px;background:#42445e;border:1px solid #ffffff0d;border-radius:12px;padding:10px 12px;font-size:13px}
    .info-row span{color:#aaa6bd;flex:0 0 auto}.info-row b{text-align:right;overflow-wrap:anywhere}
    .info-hours{margin-top:10px;background:#42445e;border:1px solid #ffffff0d;border-radius:12px;padding:10px 12px}
    .info-hours>b{display:block;margin-bottom:6px;font-size:13px}
    .info-hours span{display:block;color:#aaa6bd;font-size:12px;line-height:1.6}

    /* ===== Analyse réelle du site (scan Lighthouse) ===== */
    .scan-panel{margin-top:14px}
    .scan-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
    .scan-head .app-btn{min-height:44px}
    .scan-scores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0 6px}
    .scan-score{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
    .scan-ring{width:74px;height:74px;border-radius:50%;display:grid;place-items:center}
    .scan-ring-in{width:58px;height:58px;border-radius:50%;background:#3a3858;display:grid;place-items:center}
    .scan-ring-in strong{font-size:19px;letter-spacing:-.5px}
    .scan-score-label{font-size:11px;color:#aaa6bd;line-height:1.25}
    .scan-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0 6px}
    .scan-metric{display:flex;justify-content:space-between;gap:8px;background:#42445e;border:1px solid #ffffff0d;border-radius:12px;padding:10px 12px;font-size:12.5px}
    .scan-metric span{color:#aaa6bd;min-width:0;overflow-wrap:anywhere}
    .scan-metric b{white-space:nowrap}
    .scan-note{font-size:11.5px;color:#8f88a6;line-height:1.5;margin:10px 0 0}
    /* ===== Synthèse de visibilité (dans le dossier d'audit) ===== */
    .vis-panel{margin-top:14px}
    .vis-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .vis-score{display:flex;flex-direction:column;align-items:center;flex:0 0 auto}
    .vis-ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center}
    .vis-ring span{width:48px;height:48px;border-radius:50%;background:#35334a;display:grid;place-items:center;font-weight:800;font-size:18px;color:#f3f2f8}
    .vis-score small{font-size:10px;color:#aaa6bd;margin-top:3px}
    .vis-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .vis-col{background:#42445e;border:1px solid #ffffff0d;border-radius:12px;padding:11px 13px}
    .vis-col>b{display:block;font-size:12.5px;margin-bottom:7px}
    .vis-col.good>b{color:#6ee7b7}.vis-col.bad>b{color:#fca5a5}
    .vis-col ul{list-style:none;margin:0;padding:0}
    .vis-col li{font-size:12px;color:#d7d4e4;line-height:1.5;padding-left:14px;position:relative}
    .vis-col.good li::before{content:"✓";position:absolute;left:0;color:#34d399;font-weight:800}
    .vis-col.bad li::before{content:"▲";position:absolute;left:0;color:#fbbf24;font-size:9px;top:2px}
    .vis-none{color:#8f88a6!important}
    @media(max-width:600px){.vis-cols{grid-template-columns:minmax(0,1fr)}}
    /* ===== Présence sociale détectée ===== */
    .social-panel{margin-top:14px}
    .sp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:4px}
    .sp-card{display:flex;align-items:center;gap:10px;background:#42445e;border:1px solid #ffffff0d;border-radius:12px;padding:10px 12px;text-decoration:none;color:#f3f2f8}
    .sp-card.found{border-color:#2f6b52;background:#2c4a40}
    .sp-ico{flex:0 0 28px;width:28px;height:28px;border-radius:7px;overflow:hidden;display:grid;place-items:center;background:#ffffff10}

/* AuditIA App Store polish — consistent mobile-first finish */
:root {
  color-scheme: dark;
  --app-accent: #a78bfa;
  --app-accent-strong: #8b6cf0;
  --app-surface: #201c34;
  --app-surface-raised: #292440;
  --app-border: rgba(224,216,255,.12);
  --app-muted: #b5b0cb;
}
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overscroll-behavior-y: contain;
}
button, input, select, textarea { font: inherit; }
button, a, [role="button"] { -webkit-tap-highlight-color: transparent; }
button { touch-action: manipulation; }
:where(button, a, input, select, textarea, [tabindex]):focus-visible {
  outline: 3px solid rgba(183,157,255,.9) !important;
  outline-offset: 3px !important;
}
.workspace-app {
  padding-bottom: calc(34px + env(safe-area-inset-bottom)) !important;
}
.workspace-head h1 {
  line-height: 1.08 !important;
  text-wrap: balance;
}
.workspace-head p, .app-muted, .home-hero-copy > p {
  color: var(--app-muted);
}
.home-hero, .home-analytics-panel, .home-next-steps, .app-stat, .app-panel {
  border-color: var(--app-border) !important;
}
.home-hero {
  isolation: isolate;
  box-shadow: 0 18px 48px rgba(5,3,18,.24) !important;
}
.home-hero-copy h2 {
  line-height: 1.08 !important;
  letter-spacing: -.045em !important;
  text-wrap: balance;
}
.home-hero-copy > p {
  max-width: 48ch;
  line-height: 1.65 !important;
}
.home-hero-actions {
  gap: 10px !important;
}
.app-btn, .sidebar-nav button, .desktop-nav button, .mobile-tabbar button,
.home-step-action, .home-text-link {
  min-height: 44px;
  touch-action: manipulation;
}
.app-btn {
  font-weight: 700 !important;
  letter-spacing: -.01em;
  box-shadow: inset 0 1px rgba(255,255,255,.07);
}
.app-btn.primary {
  background: linear-gradient(135deg,#8f70f2,#7050d5) !important;
  border-color: rgba(213,199,255,.42) !important;
  color: #fff !important;
  box-shadow: 0 8px 22px rgba(93,65,188,.24), inset 0 1px rgba(255,255,255,.22) !important;
}
.app-stat, .app-panel, .home-next-steps, .home-visual {
  box-shadow: 0 12px 32px rgba(5,3,18,.16), inset 0 1px rgba(255,255,255,.025) !important;
}
.app-stat strong, .home-average-score {
  font-variant-numeric: tabular-nums;
  letter-spacing: -.04em;
}
.app-stat small, .app-panel p, .home-step p {
  line-height: 1.55;
}
.sidebar-nav button {
  border-radius: 14px !important;
  font-weight: 650;
}
.sidebar-nav button.active {
  background: rgba(151,121,245,.19) !important;
  border-color: rgba(177,153,255,.24) !important;
}
.sidebar-nav button:active, .app-btn:active, .home-step-action:active {
  transform: scale(.985);
}
@media (max-width: 760px) {
  .workspace-app {
    width: 100% !important;
    padding-left: 14px !important;
    padding-right: 14px !important;

  }
  .workspace-head { margin-top: 10px !important; }
  .home-hero { margin-bottom: 20px !important; }
  .home-hero-copy { padding: 18px 17px 20px !important; }

  .home-hero-actions { display: grid !important; grid-template-columns: minmax(0,1fr) !important; }

  .app-stats { gap: 9px !important; }
  .app-stat { min-width: 0 !important; }
  .app-stat > span { line-height: 1.35 !important; }
  .app-stat strong { font-size: clamp(22px, 6vw, 29px) !important; }
  .home-section-heading { align-items: flex-end; gap: 10px; }

}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;

/* Live audit — quatre temps, chiffres uniquement réels. */
.ap-live-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ap-clock{font-variant-numeric:tabular-nums;color:#d9d2ef;font-size:13px;font-weight:750}
.ap-biz{margin:0 0 12px!important;font-size:clamp(28px,6vw,40px)!important;letter-spacing:-1.1px!important;line-height:1.05!important}
.ap-stepkicker{margin:14px 0 4px!important;color:#b7a6ff!important;font-size:11px!important;font-weight:850;letter-spacing:1.4px}
.ap-chapter{margin:0 0 6px!important;font-size:clamp(20px,4.5vw,26px)!important;letter-spacing:-.5px!important}
.ap-chapter-sub{margin:0 0 14px!important;color:#b7b0cb!important;font-size:13px!important;line-height:1.45!important;max-width:46ch}
.ap-stage{min-height:168px;margin:0 0 14px;padding:14px;border:1px solid rgba(167,149,255,.28);border-radius:18px;background:radial-gradient(circle at 50% 55%,rgba(124,98,214,.16),transparent 58%),rgba(10,8,20,.35)}
.ap-stage-note{margin:10px 0 0!important;color:#9d96b4!important;font-size:11px!important}
.ap-browser{border:1px solid rgba(255,255,255,.12);border-radius:16px;background:#f4f1fb;color:#241f38;padding:12px;box-shadow:0 16px 40px rgba(0,0,0,.18)}
.ap-browser-bar{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.ap-browser-bar i{width:7px;height:7px;border-radius:50%;background:#d5d0e4}
.ap-browser-bar b{margin-left:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:750;background:#fff;border-radius:999px;padding:5px 10px}
.ap-skel,.ap-skel-btn{height:8px;border-radius:999px;margin:8px 0;background:linear-gradient(90deg,#e4dff3,#f7f5fc 50%,#e4dff3);background-size:200% 100%;animation:ap-shimmer 1.4s linear infinite}
.ap-skel.w60{width:60%}.ap-skel.w80{width:80%}
.ap-skel-btn{width:46%;height:28px;border-radius:10px;margin-top:14px;background:linear-gradient(90deg,#6d4de8,#8d74f5)}
.ap-radar{position:relative;height:168px;border-radius:14px;overflow:hidden;background:radial-gradient(circle,#2a2450 0 18%,transparent 19%),repeating-radial-gradient(circle at 50% 58%,rgba(176,160,255,.0) 0 28px,rgba(176,160,255,.28) 29px 30px);display:flex;align-items:center;justify-content:center}
.ap-radar-sweep{position:absolute;left:50%;top:58%;width:46%;height:2px;transform-origin:left center;background:linear-gradient(90deg,rgba(155,255,214,.15),#b7a4ff);animation:ap-sweep 3.2s linear infinite}
.ap-radar-dot{width:12px;height:12px;border-radius:50%;background:#c4b5fd;box-shadow:0 0 0 8px rgba(196,181,253,.18)}
.ap-radar-names{display:block}
.ap-chip{position:absolute;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid rgba(196,181,253,.55);background:rgba(28,24,48,.92);color:#f4f0ff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:750}
.ap-radar-names .ap-chip:nth-child(2){top:16px;left:12px}
.ap-radar-names .ap-chip:nth-child(3){top:22px;right:10px}
.ap-radar-names .ap-chip:nth-child(4){bottom:18px;left:14px}
.ap-radar-names .ap-chip:nth-child(5){bottom:16px;right:12px}
.ap-radar-names .ap-chip:nth-child(6){top:46%;left:8px}
.ap-radar-names .ap-chip:nth-child(7){top:42%;right:8px}
.ap-chip.is-wait{position:static;max-width:none}
.ap-modules{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ap-module{min-width:0;padding:12px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(255,255,255,.04)}
.ap-module b{display:block;font-size:13px;margin-bottom:4px}
.ap-module span{display:block;color:#b7b0cb;font-size:12px;line-height:1.35}
.ap-module.is-ready{border-color:rgba(155,135,255,.55);background:rgba(109,77,232,.16)}
.ap-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.ap-metrics div{padding:12px 8px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(255,255,255,.04);text-align:center}
.ap-metrics b{display:block;font-size:26px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.ap-metrics span{display:block;margin-top:2px;color:#aaa3c0;font-size:11px}
@keyframes ap-shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
@keyframes ap-sweep{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@media(max-width:540px){.ap-stage{padding:12px}.ap-metrics b{font-size:22px}.ap-chip{font-size:11px;padding:6px 8px}}
@media(prefers-reduced-motion:reduce){.ap-skel,.ap-skel-btn,.ap-radar-sweep{animation:none}}

/* Live Scan : résultats progressifs réels */
.ap-live-results{margin:18px 0;padding:16px;border:1px solid rgba(154,135,255,.24);border-radius:18px;background:linear-gradient(145deg,rgba(117,88,220,.12),rgba(15,13,28,.28))}.ap-results-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.ap-results-heading>span:last-child{font-size:11px;color:var(--muted)}.ap-live-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.ap-fact{min-width:0;padding:12px;border:1px solid rgba(255,255,255,.09);border-radius:13px;background:rgba(255,255,255,.035)}.ap-fact span,.ap-fact small{display:block;color:var(--muted);font-size:11px}.ap-fact b{display:block;margin:5px 0;font-size:16px;overflow-wrap:anywhere}.ap-fact small{line-height:1.4}.ap-facts-empty{grid-column:1/-1;padding:14px;border:1px dashed rgba(255,255,255,.14);border-radius:12px;color:var(--muted);font-size:12px}.ap-live-step{transition:background .2s ease,border-color .2s ease}.ap-live-step.is-active .ap-step-icon{animation:apPulse 1.4s ease-in-out infinite}@keyframes apPulse{0%,100%{box-shadow:0 0 0 3px rgba(139,112,245,.1)}50%{box-shadow:0 0 0 6px rgba(139,112,245,.2)}}@media(max-width:480px){.ap-live-facts{grid-template-columns:1fr}.ap-results-heading{align-items:flex-start;flex-direction:column}.ap-fact{padding:11px}}
</style>

    function legalRows(c){

    function mapCategory(primary, types){

      if(has('lodging','hotel','motel','guest','hostel','bed_and_breakfast','campground')) return 'Hébergement';
      if(has('car_dealer','car_repair','car_wash','gas_station','auto_parts','automotive')) return 'Automobile';

    async function fetchDomainDate(website){

        if(!r.ok) return null;

    async function fetchSirene(c){

      const city=String((c&&c.city)||'').trim();

      let data=null;

      if(!data){ try{ const r2=await withTimeout(fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url)),15000); if(r2.ok) data=await r2.json(); }catch(e){} }
      const res=data&&data.results&&data.results[0]; if(!res) return {matched:false};

      return { matched:true, siren:res.siren||'', siret:siege.siret||'',
        denomination:res.nom_complet||res.nom_raison_sociale||'',
        dateCreation:siege.date_creation||res.date_creation||'',

        fetchedAt:new Date().toISOString() };

    function targetKeywords(c){

      const t=((c&&c.name)||'')+' '+((c&&c.category)||d.category||'')+' '+(d.primaryType||'');
      const s=t.toLowerCase();
      const map=[
        [/camping|campground|rv[_ ]?park|holiday[_ ]?park|mobil.?home|mobilhome|caravan|bungalow|village.?vacances/,['camping','location mobil-home','où dormir en camping']],
        [/resort/,['hébergement','village vacances','où dormir']],
        [/hotel|h[ôo]tel|motel|hostel|auberge|bed_and_breakfast|b&b/,['hôtel','où dormir']],
        [/lodging|h[ée]berg|g[îi]te|chambre.?d|logement|guest/,['hébergement','où dormir']],
        [/boulanger|bakery|p[âa]tiss/,['boulangerie','pâtisserie','pain artisanal']],
        [/restaurant|meal_|food|brasserie|pizz|diner|traiteur/,['restaurant','où manger','meilleur restaurant']],
        [/cafe|coffee|\bbar\b|pub/,['café','bar','terrasse']],
        [/hair|salon|coiff|barber/,['coiffeur','salon de coiffure','barbier']],
        [/nail|ongle/,['onglerie','manucure']],
        [/spa|wellness|massage|beaut/,['institut de beauté','spa','soin du visage']],
        [/plumb|plomb/,['plombier','dépannage plomberie']],
        [/electric|électric/,['électricien','dépannage électrique']],
        [/paint|peint|fa[çc]ad/,['peintre','façadier','ravalement de façade']],
        [/garage|car_repair|auto|m[ée]can/,['garage auto','réparation voiture','garagiste']],
        [/pharmac/,['pharmacie']],
        [/fleuri|florist/,['fleuriste','livraison de fleurs']],
        [/store|shop|market|boutique|commerce/,['boutique','magasin']]
      ];
      let base=[]; for(const [rx,ks] of map){ if(rx.test(s)){ base=ks; break; } }
      if(!base.length){ const cat=String((c&&c.category)||d.category||'').trim(); base=[cat&&cat.toLowerCase()!=='autre'?cat.toLowerCase():'commerce']; }
      const b0=base[0];
      const seo=new Set(); base.forEach(b=>seo.add(city?b+' '+city:b));
      if(city){ ['meilleur '+b0+' '+city,b0+' près de '+city,'avis '+b0+' '+city,b0+' '+city+' horaires'].forEach(k=>seo.add(k)); }
      const geo=[]; if(city){ geo.push('Quel est le meilleur '+b0+' à '+city+' ?'); geo.push('Où trouver un bon '+b0+' à '+city+' ?'); geo.push('Recommande-moi un '+b0+' à '+city); }
      return { seo:[...seo].slice(0,8), geo:geo.slice(0,3), base:b0, city };

    function socialVisibility(a){

      const parts=[]; if(dom&&!isNaN(dom.getTime())) parts.push('domaine enregistré le '+dom.toLocaleDateString('fr-FR')); if(cy) parts.push('mention « '+cy+' » sur le site');

    function nearbyOpportunity(p){
      const reasons=[]; let score=0;
      if(!p.website){score+=35;reasons.push('aucun site web trouvé dans Google Places');}
      if(!Array.isArray(p.hours)||!p.hours.length){score+=15;reasons.push('horaires non renseignés dans la fiche');}
      if(p.rating==null){score+=15;reasons.push('note Google indisponible');}
      else if(p.rating<4){score+=20;reasons.push('note Google sous 4/5');}
      if(Number(p.reviews||0)<10){score+=15;reasons.push('moins de 10 avis Google');}
      else if(Number(p.reviews||0)<30){score+=8;reasons.push('moins de 30 avis Google');}
      if(p.status==='CLOSED_PERMANENTLY'){score=0;reasons.splice(0,reasons.length,'établissement signalé fermé définitivement');}
      return {score:Math.min(100,score),reasons:reasons.slice(0,3),closed:p.status==='CLOSED_PERMANENTLY'};
    }

    function getBrowserPosition(){
      return new Promise((resolve,reject)=>{
        if(!navigator.geolocation){reject(new Error('La géolocalisation n’est pas disponible sur cet appareil.'));return;}
        navigator.geolocation.getCurrentPosition(
          pos=>resolve({latitude:pos.coords.latitude,longitude:pos.coords.longitude}),
          err=>reject(new Error(err.code===1?'Autorise la localisation dans Safari pour trouver les commerces proches.':err.code===2?'Position indisponible. Vérifie que la localisation est activée.':'La demande de position a expiré. Réessaie.')),
          {enableHighAccuracy:true,timeout:12000,maximumAge:60000}
        );
      });

      nearbyBusy=true;nearbyStatus='Autorise la localisation si Safari te le demande…';renderApp();
      try{
        const pos=await getBrowserPosition();
        nearbyStatus='Recherche des établissements proches…';renderApp();
        const r=await withTimeout(fetch('https://places.googleapis.com/v1/places:searchNearby',{
          method:'POST',
          headers:{'Content-Type':'application/json','X-Goog-Api-Key':key,'X-Goog-FieldMask':'places.id,places.displayName,places.formattedAddress,places.addressComponents,places.primaryType,places.types,places.nationalPhoneNumber,places.websiteUri,places.rating,places.userRatingCount,places.businessStatus,places.regularOpeningHours'},

        }),15000);

        const d=await r.json();
        nearbyBusinesses=(d.places||[]).map(normalizePlace).filter(p=>p.placeId&&p.name);
        nearbyBusinesses.sort((a,b)=>nearbyOpportunity(b).score-nearbyOpportunity(a).score||((a.reviews||0)-(b.reviews||0)));

    function sparkline(vals){

      const up=vals[vals.length-1]>=vals[0], col=up?'#34d399':'#f87171';
      const dots=pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.5" fill="'+col+'"/>').join('');
      return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true"><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+dots+'</svg>';
    }

    async function fetchPagespeed(site){
      const key=String((appSettings&&appSettings.pagespeed_api_key)||'').trim();
      const u=new URL('https://www.googleapis.com/pagespeedonline/v5/runPagespeed');
      u.searchParams.set('url',site); u.searchParams.set('strategy','mobile');
      ['performance','accessibility','best-practices','seo'].forEach(cat=>u.searchParams.append('category',cat));
      u.searchParams.set('locale','fr'); if(key) u.searchParams.set('key',key);
      const r=await withTimeout(fetch(u.toString()),60000);
      if(!r.ok){ if(key&&(r.status===400||r.status===401||r.status===403)) keyStoreSet('pagespeed',false,key); const dd=await r.json().catch(()=>null); const m=(dd&&dd.error&&dd.error.message)||('HTTP '+r.status); throw new Error(r.status===429?'quota PageSpeed atteint':r.status===400?'adresse non analysable':m); }
      const data=await r.json(); const lh=data.lighthouseResult; if(key) keyStoreSet('pagespeed',true,key);
      if(!lh||!lh.categories) throw new Error('aucun résultat Lighthouse');
      const sc=k=>typeof (lh.categories[k]||{}).score==='number'?Math.round(lh.categories[k].score*100):null;
      const au=lh.audits||{}; const dv=k=>(au[k]&&au[k].displayValue)||null;
      const cleanTxt=t=>String(t||'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/\s+/g,' ').trim();
      const recommendations=Object.values(au).filter(x=>x&&typeof x.score==='number'&&x.score<0.9&&x.title&&(x.scoreDisplayMode==='metricSavings'||(x.details&&x.details.type==='opportunity')||x.scoreDisplayMode==='binary'||x.scoreDisplayMode==='numeric')).sort((x,y)=>x.score-y.score).slice(0,8).map(x=>({title:cleanTxt(x.title),detail:cleanTxt(x.description),gain:x.displayValue||null,severity:x.score<0.5?'haute':'moyenne'}));
      return { provider:'Google PageSpeed Insights · Lighthouse (mobile)', analyzedAt:new Date().toISOString(), url:site, finalUrl:lh.finalDisplayedUrl||site, scores:{performance:sc('performance'),accessibility:sc('accessibility'),bestPractices:sc('best-practices'),seo:sc('seo')}, metrics:{ 'Contenu affiché (FCP)':dv('first-contentful-paint'), 'Plus grand contenu (LCP)':dv('largest-contentful-paint'), 'Interactivité (TBT)':dv('total-blocking-time'), 'Stabilité visuelle (CLS)':dv('cumulative-layout-shift'), 'Vitesse (Speed Index)':dv('speed-index') }, recommendations };
    }

    function setPhase(phase,target){
      if(!fullAuditState) return;
      const prev=fullAuditState.steps.find(st=>st.status==='active');
      if(prev) prev.status='done';
      const label=String(phase||'').replace(/&amp;/g,'&');
      let step=fullAuditState.steps.find(st=>st.label===label);
      if(!step){ step={label,status:'active'}; fullAuditState.steps.push(step); }
      else step.status='active';
      fullAuditState.phase=label; fullAuditState.target=target;
      const seen=liveChapter(label);
      if(!fullAuditState.chapterSeen||seen>fullAuditState.chapterSeen) fullAuditState.chapterSeen=seen;
      tickProgress();
    }
    function setAuditFact(label,value,detail){
      if(!fullAuditState) return;
      if(!Array.isArray(fullAuditState.facts)) fullAuditState.facts=[];
      const key=String(label||''), fact={label:key,value:String(value??'Indisponible'),detail:String(detail||'Résultat reçu')};
      const i=fullAuditState.facts.findIndex(x=>x.label===key);
      if(i>=0) fullAuditState.facts[i]=fact; else fullAuditState.facts.push(fact);
      fullAuditState.facts=fullAuditState.facts.slice(-6); tickProgress();
    }
    function markPhaseLimited(phase){
      if(!fullAuditState) return;

      const step=fullAuditState.steps.find(st=>st.label===label);
      if(step && step.status==='active') step.status='limited';
    }

    function visibilityAudit(a,c){

      /* ---- SEO : être trouvé quand on cherche sur Google ---- */
      add('seo','Fiche Google Business',hasGoogle,18,'Créer ou revendiquer la fiche Google Business Profile : sans elle, le commerce est quasi invisible dans les recherches locales et sur Maps.','Fiche Google présente et renseignée.');
      add('seo','Site web',!!site,16,'Aucun site web : impossible d’être bien référencé. Une vitrine (services, coordonnées, horaires) est la base.','Le commerce dispose d’un site web.');
      if(site) add('seo','Site sécurisé (HTTPS)',secure,4,'Le site n’est pas en HTTPS : les navigateurs le signalent comme « non sécurisé », ce qui nuit au référencement et à la confiance.','Site sécurisé en HTTPS.');
      if(rating!=null){ const rv=tier(rating,[[4.6,1],[4.2,0.9],[4.0,0.8],[3.5,0.55],[3.0,0.3],[0,0.15]]); add('seo','Note Google',rating>=4.0,10,'Note Google sous 4/5 : elle pèse sur le classement local. Répondre aux avis et solliciter les clients satisfaits.','Bonne note Google ('+rating+'/5).',rv); }
      else add('seo','Note Google',false,10,'Pas encore de note Google : les premiers avis manquent pour rassurer et bien se classer.','',0);
      { const rv=tier(reviews,[[50,1],[20,0.85],[10,0.6],[3,0.35],[1,0.15],[0,0]]); add('seo','Volume d’avis',reviews>=20,10,'Trop peu d’avis ('+reviews+') : un flux régulier d’avis améliore le classement et la confiance.',reviews+' avis clients.',rv); }
      add('seo','Horaires renseignés',hours,5,'Horaires absents de la fiche : Google les affiche dans les résultats, leur absence fait perdre des clics.','Horaires renseignés sur Google.');

      if(perf!=null){ const pv=tier(perf,[[90,1],[70,0.8],[50,0.6],[30,0.35],[0,0.15]]); add('seo','Performance mobile',perf>=50,8,'Site lent sur mobile (perf '+perf+'/100) : pénalise le référencement et fait fuir les visiteurs.','Site rapide sur mobile (perf '+perf+'/100).',pv); }
      if(seoLh!=null){ const lv=tier(seoLh,[[90,1],[70,0.75],[50,0.5],[0,0.25]]); add('seo','Référencement technique (Lighthouse)',seoLh>=80,6,'Bases SEO techniques incomplètes (score '+seoLh+'/100) : balises, structure et liens internes à corriger.','Bases SEO techniques correctes ('+seoLh+'/100).',lv); }
      if(si){ const tv=(si.title&&si.metaDesc)?1:(si.title||si.metaDesc)?0.5:0; add('seo','Balises SEO (titre + description)',!!(si.title&&si.metaDesc),8,'Titre ou meta-description manquants : Google n’a pas de résumé clair à afficher.','Titre et description présents sur le site.',tv); }

    const pwdField = (id,label,ac) => '<label class="login-field" for="'+id+'"><span>'+label+'</span><span class="password-wrap"><input class="login-control" id="'+id+'" type="password" autocomplete="'+ac+'" required minlength="8"><button class="toggle-password" type="button" data-showpwd="'+id+'" aria-label="Afficher le mot de passe" title="Afficher le mot de passe">'+EYE+'</button></span></label>';
    const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
    const pwdIssue = p => p.length<8 ? '8 caractères minimum.' : (!/[A-Za-zÀ-ÿ]/.test(p)||!/\d/.test(p)) ? 'au moins une lettre et un chiffre.' : p.length>72 ? '72 caractères maximum.' : '';
    function authError(e){
      const m=((e&&(e.message||e.error_description))||'').toLowerCase(), st=e&&e.status;
      if(st===429||m.includes('rate limit')||m.includes('too many')) return 'Trop de tentatives. Patientez quelques minutes avant de réessayer.';
      if(m.includes('invalid login')) return 'E-mail ou mot de passe incorrect.';
      if(m.includes('email not confirmed')) return 'Votre adresse e-mail n’est pas encore confirmée. Ouvrez le lien reçu par e-mail.';
      if(m.includes('same password')||m.includes('different from the old')) return 'Choisissez un mot de passe différent de l’ancien.';
      if(m.includes('password')&&(m.includes('weak')||m.includes('at least')||m.includes('should'))) return 'Mot de passe trop faible : 8 caractères minimum, avec au moins une lettre et un chiffre.';
      if(m.includes('fetch')||m.includes('network')) return 'Connexion impossible. Vérifiez votre réseau internet.';
      return 'Une erreur est survenue. Réessayez.';
    }

      if(mode==='forgot'){
        card='<section class="login-card"><h1>Mot de passe oublié</h1><p class="login-subtitle">Indiquez votre adresse : vous recevrez un lien sécurisé pour choisir un nouveau mot de passe.</p>'
          +'<form id="fForgot" novalidate><label class="login-field" for="foEmail"><span>Adresse e-mail</span><input class="login-control" id="foEmail" type="email" inputmode="email" autocomplete="username" placeholder="vous@exemple.fr" required></label>'
          +'<button class="login-submit" type="submit">Envoyer le lien</button><div class="login-message" id="authMsg" role="status" aria-live="polite"></div></form></section>'
          +'<p class="login-create"><button type="button" data-go="signin">← Retour à la connexion</button></p>';
      } else if(mode==='reset'){
        card='<section class="login-card"><h1>Nouveau mot de passe</h1><p class="login-subtitle">Choisissez un nouveau mot de passe pour votre compte AuditIA.</p>'
          +'<form id="fReset" novalidate>'+pwdField('rPwd','Nouveau mot de passe','new-password')+pwdField('rPwd2','Confirmer le mot de passe','new-password')
          +'<p class="login-hint">8 caractères minimum, avec au moins une lettre et un chiffre.</p>'
          +'<button class="login-submit" type="submit">Enregistrer</button><div class="login-message" id="authMsg" role="status" aria-live="polite"></div></form></section>';
      } else if(mode==='expired'){
        card='<section class="login-card"><h1>Lien expiré</h1><p class="login-subtitle">Ce lien n’est plus valable : il a expiré ou a déjà été utilisé. Demandez-en un nouveau, ou connectez-vous si vous avez déjà un mot de passe.</p>'
          +'<button class="login-submit" type="button" data-go="forgot">Recevoir un nouveau lien</button>'
          +'<button class="login-reset" type="button" data-go="signin">Retour à la connexion</button></section>';
      } else {
        card='<section class="login-card"><h1>Connexion</h1><p class="login-subtitle">Retrouvez vos audits et votre espace de travail.</p>'
          +'<form id="fSignin" novalidate><label class="login-field" for="siEmail"><span>Adresse e-mail</span><input class="login-control" id="siEmail" type="email" inputmode="email" autocomplete="username" placeholder="vous@exemple.fr" required></label>'
          +pwdField('siPwd','Mot de passe','current-password')
          +'<button class="login-submit" type="submit">Se connecter</button><button class="login-reset" type="button" data-go="forgot">Mot de passe oublié ?</button>'
          +'<div class="login-message" id="authMsg" role="status" aria-live="polite"></div></form></section>';
      }
      authRoot.innerHTML = BRAND + card + FOOT;
      window.scrollTo(0,0);
      const first = authRoot.querySelector('input'); if(first) setTimeout(()=>first.focus(),60);
    }

    let loginFails=0, loginLockUntil=0;
    async function doSignin(e){
      e.preventDefault();
      const btn=e.target.querySelector('.login-submit');
      const email=val('siEmail').toLowerCase(), pwd=document.getElementById('siPwd').value;
      if(Date.now()<loginLockUntil){setMsg('Trop d’essais. Réessayez dans '+Math.ceil((loginLockUntil-Date.now())/1000)+' secondes.');return;}
      if(!validEmail(email)){setMsg('Saisissez une adresse e-mail valide.');return;}
      if(!pwd){setMsg('Saisissez votre mot de passe.');return;}
      busy(btn,true,'Connexion…'); setMsg('');
      const {data,error}=await sb.auth.signInWithPassword({email,password:pwd});
      busy(btn,false);
      if(error){ loginFails++; if(loginFails>=5){loginLockUntil=Date.now()+60000;loginFails=0;} setMsg(authError(error)); return; }
      if(email!==ADMIN_EMAIL){ await sb.auth.signOut(); setMsg('Ce compte n’est pas autorisé à accéder à AuditIA.'); return; }
      loginFails=0;
      try{ await openWorkspace(sb,data.user); }catch(err){ setMsg(err&&err.message||'Connexion impossible.'); }
    }
    async function doForgot(e){
      e.preventDefault();
      const btn=e.target.querySelector('.login-submit');
      const email=val('foEmail').toLowerCase();
      if(!validEmail(email)){setMsg('Saisissez une adresse e-mail valide.');return;}
      busy(btn,true,'Envoi…'); setMsg('');
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:REDIRECT_URL});
      busy(btn,false);
      if(error&&(error.status===429||/rate/i.test(error.message||''))){ setMsg(authError(error)); return; }
      setMsg('Si un compte existe avec cette adresse, un e-mail vient d’être envoyé. Pensez à regarder dans les indésirables.','ok');
    }
    async function doReset(e){
      e.preventDefault();
      const btn=e.target.querySelector('.login-submit');
      const p=document.getElementById('rPwd').value, p2=document.getElementById('rPwd2').value;
      const pi=pwdIssue(p); if(pi){setMsg('Mot de passe trop faible : '+pi);return;}
      if(p!==p2){setMsg('Les deux mots de passe ne sont pas identiques.');return;}
      busy(btn,true,'Enregistrement…'); setMsg('');
      const {error}=await sb.auth.updateUser({password:p});
      busy(btn,false);
      if(error){ setMsg(authError(error)); return; }
      setMsg('Mot de passe modifié.','ok');
      try{ const {data}=await sb.auth.getUser(); if(data&&data.user){ await openWorkspace(sb,data.user); return; } }catch(err){}
      renderAuth('signin'); setMsg('Mot de passe modifié. Vous pouvez vous connecter.','ok');
    }

    authRoot.addEventListener('click', e=>{
      const go=e.target.closest('[data-go]'); if(go){ renderAuth(go.dataset.go); return; }
      const sp=e.target.closest('[data-showpwd]');
      if(sp){ const inp=document.getElementById(sp.dataset.showpwd); if(inp){ const show=inp.type==='password'; inp.type=show?'text':'password'; sp.setAttribute('aria-label',show?'Masquer le mot de passe':'Afficher le mot de passe'); } }
    });
    authRoot.addEventListener('submit', e=>{
      if(e.target.id==='fSignin') doSignin(e);
      else if(e.target.id==='fForgot') doForgot(e);
      else if(e.target.id==='fReset') doReset(e);
    });

    let recoveryShown=false;
    function showAuthLoading(){ authRoot.innerHTML = '<section class="splash auth-loading" role="status" aria-live="polite"><div class="splash-scene" aria-hidden="true"><svg class="splash-art" viewBox="0 0 280 150"><ellipse cx="140" cy="142" rx="78" ry="7" fill="#000" opacity=".28"/><path d="M62 86 140 34l78 52" fill="#efe8ff"/><path d="M74 84h132v52H74z" fill="#3c345f"/><rect x="70" y="80" width="140" height="8" fill="#51447a"/><rect x="96" y="98" width="30" height="24" rx="2" fill="#ffe7c2"/><rect x="154" y="98" width="30" height="24" rx="2" fill="#ffe7c2"/><path d="M111 98v24M96 110h30M169 98v24M154 110h30" stroke="#b8884a" stroke-width="1.2" opacity=".7"/><rect x="126" y="108" width="28" height="28" rx="2" fill="#1b162c"/><rect x="132" y="114" width="16" height="10" rx="1.5" fill="#ffe7c2"/></svg></div><div class="splash-brand"><div class="splash-mark" aria-hidden="true">A<span>✓</span></div><div class="splash-name"><h1 class="splash-word">Audit<span>IA</span></h1><small>by AffiAds</small></div></div><p>La visibilité de vos commerces, sous contrôle.</p><div class="splash-bar" aria-hidden="true"><span></span></div></section>'; }
    async function boot(){
      showAuthLoading();
      await getClient();
      const hp=new URLSearchParams(location.hash.slice(1)), qp=new URLSearchParams(location.search);
      const linkType=hp.get('type')||qp.get('type')||'';
      const linkErr=hp.get('error_code')||qp.get('error_code')||hp.get('error')||qp.get('error')||'';
      sb.auth.onAuthStateChange(ev=>{ if(ev==='PASSWORD_RECOVERY'&&!recoveryShown){ recoveryShown=true; renderAuth('reset'); } });
      let session=null;
      try{ const {data}=await sb.auth.getSession(); session=data.session; }catch(err){}
      const dirty=/access_token|refresh_token|error|type=/.test(location.hash+location.search);
      if(dirty && linkType!=='recovery') history.replaceState(null,'',location.pathname);
      if(linkErr){ renderAuth('expired'); return; }
      if(linkType==='recovery'){ recoveryShown=true; renderAuth('reset'); return; }
      if(session&&session.user){
        try{ await openWorkspace(sb,session.user); return; }
        catch(err){ renderAuth('signin'); setMsg(err&&err.message||'Connexion impossible.'); return; }
      }
      renderAuth('signin');
    }
    boot();
    if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }

  </script>
  <footer class="wrap foot"><span>© <span id="year"></span> AuditIA · AffiAds</span><span>Espace privé AuditIA · Vos paramètres sont synchronisés.</span></footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
