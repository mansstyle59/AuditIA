  <style>
    :root{color-scheme:dark;--bg:#262343;--panel:#343050;--panel2:#3e3660;--text:#f8f6ff;--muted:#b5aecb;--purple:#9a87ff;--orange:#ffad72;--line:#564e7a}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#4f3c9a 0,transparent 35%),radial-gradient(ellipse at 0% 45%,#3f3474 0,transparent 35%),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    a{color:inherit}.wrap{width:min(1120px,100% - 40px);margin:auto}.top{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12}.brand{display:flex;align-items:center;gap:12px;text-decoration:none}.brand img{width:42px;height:42px}.brand strong{display:block;font-size:18px;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase}.toplink{font-size:13px;text-decoration:none;color:var(--muted)}
    .hero{display:grid;grid-template-columns:1.15fr .85fr;gap:50px;align-items:center;padding:90px 0 70px}.pill{display:inline-flex;align-items:center;gap:9px;border:1px solid #7c69de77;background:#34265e8a;color:#d9d0ff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700}.dot{width:7px;height:7px;border-radius:50%;background:#7be4b5;box-shadow:0 0 0 4px #7be4b51a}h1{font-size:clamp(42px,6vw,72px);line-height:1.02;letter-spacing:-3.5px;margin:24px 0 22px}h1 em{font-style:normal;color:var(--purple)}.lead{max-width:580px;color:var(--muted);font-size:18px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 19px;border-radius:14px;text-decoration:none;font-weight:750;font-size:14px;border:1px solid transparent;transition:transform .16s,filter .16s}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.primary{background:linear-gradient(135deg,var(--purple),#7255db);color:white;box-shadow:0 12px 32px #7255db40}.secondary{border-color:var(--line);background:#ffffff08;color:var(--text)}.hint{margin-top:15px;color:#938aa9;font-size:12px}
    .preview{border:1px solid #ffffff1c;border-radius:28px;background:linear-gradient(155deg,#3e3660f2,#141022fa);padding:22px;box-shadow:0 35px 100px #03020a80;transform:rotate(1deg)}.preview-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}.badge{background:#274f44;color:#8de3bb;border:1px solid #3a6e5c;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:800}.scorebox{display:flex;align-items:center;gap:18px;margin:24px 0 21px}.gauge{width:98px;height:98px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--purple) 0 78%,#564e7a 78%);position:relative}.gauge:before{content:"";position:absolute;inset:8px;background:#343050;border-radius:50%}.gauge strong{position:relative;font-size:27px}.scoretext b{display:block;font-size:17px}.scoretext span{font-size:12px;color:var(--muted)}.metric{padding:14px 0;border-top:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;gap:12px}.metric span{font-size:13px;color:var(--muted)}.metric b{font-size:13px}.good{color:#8de3bb}.purple{color:#c3b7ff}.orange{color:var(--orange)}
    section{padding:45px 0 60px}.section-top{text-align:center;max-width:650px;margin:0 auto 30px}.eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--orange);font-weight:800}.section-top h2{font-size:clamp(27px,4vw,40px);line-height:1.1;letter-spacing:-1.5px;margin:12px 0}.section-top p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:1px solid var(--line);background:linear-gradient(145deg,#1b172cdd,#322e4edd);padding:22px;border-radius:20px}.icon{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:#49397e;color:#c8bcff;font-size:19px;margin-bottom:18px}.card h3{font-size:16px;margin:0 0 8px}.card p{font-size:13px;color:var(--muted);margin:0}.bottom{margin:25px 0 65px;display:flex;justify-content:space-between;align-items:center;gap:25px;border:1px solid #6c5abb66;border-radius:24px;padding:28px;background:linear-gradient(110deg,#3a3064,#2c2546)}.bottom h2{margin:0 0 7px;font-size:24px}.bottom p{margin:0;color:var(--muted);font-size:13px}.foot{border-top:1px solid #ffffff13;color:#827a99;font-size:12px;padding:22px 0 32px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

    .login-page{min-height:calc(100svh - 148px);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:30px 0 26px}

    .login-foot{color:#8f87a8;text-align:center;margin:30px auto 0;font-size:13px}
    .login-status{font-size:12px;color:#8f87a8;text-align:center;margin-top:8px}
    .auth-view-toggle{display:flex;justify-content:center;gap:14px;margin:0 0 26px;flex-wrap:wrap}.auth-view-toggle button{border:1px solid #dfdaef;background:#f6f4ff;color:#4c36c2;border-radius:999px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer}

    .workspace-app{width:min(1120px,100%);margin:0 auto;padding:10px 0 36px;color:var(--text)}
    .workspace-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:12px 0 22px}

    .sidebar-brand img{width:40px;height:40px;object-fit:contain;border-radius:12px;background:#49397e;padding:4px}

    .sidebar-nav{display:grid;gap:5px}.sidebar-nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--muted);padding:12px;border-radius:12px;font-weight:750;cursor:pointer}
    .sidebar-nav button.active{color:#fff;background:linear-gradient(110deg,#493681,#2b2248);border-color:#7763c755}
    .nav-icon{width:24px;text-align:center;font-size:17px}.sidebar-bottom{border-top:1px solid #ffffff14;margin-top:12px;padding:12px 6px 4px;color:var(--muted);font-size:11px}
    .workspace-main{min-width:0}.workspace-head{margin-top:0}

/* AuditIA iPhone-first visual refresh, inspired by FormIA's restrained tab navigation */
.workspace-app{width:min(1240px,100%);margin:0 auto;padding:18px 18px 38px;color:var(--text)}
.workspace-layout{grid-template-columns:224px minmax(0,1fr);gap:22px}
.workspace-sidebar{top:18px;border:1px solid #ffffff12;border-radius:22px;background:#302c4c;padding:12px;box-shadow:none}
.sidebar-brand{padding:8px 8px 18px;margin-bottom:10px;border-bottom:1px solid #ffffff10}
.sidebar-brand img{width:42px;height:42px;border-radius:13px}
.sidebar-nav{gap:4px}
.sidebar-nav button{padding:12px 13px;border-radius:13px;font-size:14px;transition:background .16s,color .16s}
.sidebar-nav button.active{background:#453f6c;border-color:transparent;color:#c9baff}
.sidebar-nav button.active .nav-icon{color:#a38bff}
.nav-icon{font-size:19px;width:23px}
.workspace-head{padding:8px 2px 19px;margin:0 0 15px;border-bottom:1px solid #ffffff0d}
.workspace-head h1{font-size:clamp(26px,3vw,34px);font-weight:780;letter-spacing:-1.3px}
.workspace-head .eyebrow{font-size:10px;letter-spacing:1.6px;color:#a99bd5}
.workspace-head p{font-size:12px;color:#aaa3be}
.app-btn{border-radius:12px;background:#363352;border-color:#ffffff16;padding:10px 13px;font-size:13px;transition:background .15s,border-color .15s}

      .r-notes{white-space:pre-wrap;font-size:12.5px;background:#f9f8fd;border-radius:8px;padding:10px}

      .r-good-h{color:#1f9d57!important;border-bottom-color:#d8efe0!important}.r-bad-h{color:#c0392b!important;border-bottom-color:#f3dad5!important}
      .r-list{list-style:none;margin:0;padding:0}.r-list li{margin-bottom:7px;padding-left:16px;position:relative;font-size:12px;break-inside:avoid}
      .r-list li b{font-size:12.5px}.r-list li span{display:block;color:#777;font-size:11px;line-height:1.4}

      .r-plan{display:flex;flex-direction:column;gap:7px}

      .r-vis-label{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;vertical-align:middle}

    /* ===== Bannière d'alerte clé API + écran de chargement connexion ===== */
    .key-alert{display:flex;align-items:center;gap:12px;background:#3a2719;border:1px solid #7a512b;border-radius:16px;padding:13px 15px;margin:0 0 14px}

    .key-alert p{margin:3px 0 0;font-size:12px;color:#e8c9a6;line-height:1.4}
    .key-alert .app-btn{flex:0 0 auto;min-height:40px;background:#5a3c1f;border-color:#8a5a2e;color:#ffe3c2}

    /* ===== Bannière des commerces autour de moi ===== */
    .nearby-banner{position:relative;overflow:hidden;margin:20px 0 28px;padding:22px;border:1px solid #7969b7;border-radius:22px;background:radial-gradient(ellipse at 100% 0%,#6250a555,transparent 48%),linear-gradient(135deg,#30294f,#24213b);box-shadow:0 16px 40px #09071535}
    .nearby-banner-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
    .nearby-banner h2{margin:4px 0 6px;font-size:clamp(20px,3vw,27px);letter-spacing:-.7px}
    .nearby-banner p{margin:0;color:var(--muted);font-size:13px;max-width:650px}
    .nearby-load{flex:0 0 auto;min-height:44px}
    .nearby-status{margin-top:12px;color:#cfc5ff;font-size:12px}
    .nearby-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
    .nearby-card{display:flex;align-items:center;gap:12px;min-width:0;padding:13px;border:1px solid #ffffff1c;border-radius:15px;background:#ffffff08}
    .nearby-card-icon{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:13px;background:#4b3c7b;font-size:20px}
    .nearby-card-main{min-width:0;flex:1}
    .nearby-card-main b{display:block;font-size:13px;line-height:1.35;overflow-wrap:anywhere}
    .nearby-card-main small{display:block;color:var(--muted);font-size:11px;line-height:1.4;margin-top:4px;overflow-wrap:anywhere}
    .nearby-audit-btn{flex:0 0 auto;padding:9px 11px!important;font-size:12px!important}
    @media(max-width:640px){.nearby-banner{padding:17px;margin:16px 0 22px}.nearby-banner-head{display:block}.nearby-load{width:100%;margin-top:13px}.nearby-list{grid-template-columns:1fr}.nearby-card{align-items:flex-start}.nearby-audit-btn{align-self:center;padding:9px!important}}

    /* ===== Recherche automatique de commerces (Google Places) ===== */
    .place-search{margin-bottom:14px}

    .ac-input{width:100%;border:1px solid #565472;background:#2f2d40;color:#f5f3fb;border-radius:13px;padding:14px 15px;min-height:50px;font-size:16px}
    .ac-input:focus{outline:2px solid #8268ff80;border-color:#8268ff}
    .ac-list{display:grid;gap:6px;margin-top:8px}
    .ac-item{display:block;width:100%;text-align:left;background:#403e56;border:1px solid #524f6c;border-radius:12px;padding:12px 13px;cursor:pointer;color:#f3f2f8}
    .ac-item:hover{background:#4a4866;border-color:#6a6790}
    .ac-item b{display:block;font-size:14px;line-height:1.3}

    .place-msg{font-size:12.5px;color:#cdbffb;background:#453f6c;border:1px solid #675f95;border-radius:12px;padding:10px 12px;margin:10px 0 0;line-height:1.5}

    .place-info{min-width:0}.place-info b{font-size:14px;line-height:1.3}.place-info small{display:block;color:#aaa6bd;font-size:11.5px;line-height:1.4;overflow-wrap:anywhere}
    .place-card .app-btn{flex:0 0 auto;min-height:40px}

    .info-panel{margin-top:14px}

    .info-hours>b{display:block;margin-bottom:6px;font-size:13px}
    .info-hours span{display:block;color:#aaa6bd;font-size:12px;line-height:1.6}

    /* ===== Analyse réelle du site (scan Lighthouse) ===== */
    .scan-panel{margin-top:14px}
    .scan-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
    .scan-head .app-btn{min-height:44px}
    .scan-scores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0 6px}

    /* ===== Synthèse de visibilité (dans le dossier d'audit) ===== */
    .vis-panel{margin-top:14px}
    .vis-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .vis-score{display:flex;flex-direction:column;align-items:center;flex:0 0 auto}

    .vis-col.bad li::before{content:"▲";position:absolute;left:0;color:#fbbf24;font-size:9px;top:2px}

    /* ===== Présence sociale détectée ===== */
    .social-panel{margin-top:14px}
    .sp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:4px}
    .sp-card{display:flex;align-items:center;gap:10px;background:#42445e;border:1px solid #ffffff0d;border-radius:12px;padding:10px 12px;text-decoration:none;color:#f3f2f8}

    /* ===== Diagnostic SEO & GEO (synthèse à l'écran) ===== */

    .pil{background:#42445e;border:1px solid #ffffff0d;border-radius:14px;padding:13px}

    .pil-ttl b{display:block;font-size:15px;font-weight:800}
    .pil-ttl small{display:block;color:#aaa6bd;font-size:11px;line-height:1.3;margin-top:2px}
    .pil-score{flex:0 0 auto;font-size:22px;font-weight:800;line-height:1}.pil-score small{font-size:11px;color:#9a94ad;font-weight:700}

    @media(max-width:600px){.pil-grid{grid-template-columns:minmax(0,1fr)}}
    /* ===== Analyse complète : bouton + barre de progression ===== */
    .analyse-panel{margin-top:14px;border:1px solid #5a4fb0!important;background:linear-gradient(180deg,#3a3566,#322e4e)!important}

    /* ===== Capture du site + plan d'amélioration ===== */
    .shot-panel{margin-top:14px}

    .improve-panel{margin-top:14px}
    .imp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

    .imp-title{font-size:14.5px;font-weight:800;margin:0 0 6px;line-height:1.3}
    .imp-why{font-size:12.5px;line-height:1.5;color:#d7d4e4;margin:0 0 8px}.imp-why b{color:#fff}
    .imp-how{font-size:12.5px;color:#cfccdd}.imp-how>b{display:block;margin-bottom:4px;color:#fff}

    function mapCategory(primary, types){

    /* Informations légales officielles via l'API publique Recherche d'entreprises (base SIRENE / INSEE).
       Donne : SIREN/SIRET, raison sociale, date de création réelle, activité (NAF), dirigeant. */
    async function fetchSirene(c){
      const name=String((c&&c.name)||'').trim(); if(!name) return {matched:false};
      const city=String((c&&c.city)||'').trim();
      const url='https://recherche-entreprises.api.gouv.fr/search?q='+encodeURIComponent((name+' '+city).trim())+'&page=1&per_page=1';
      let data=null;

      if(!data){ try{ const r2=await withTimeout(fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url)),15000); if(r2.ok) data=await r2.json(); }catch(e){} }
      const res=data&&data.results&&data.results[0]; if(!res) return {matched:false};

      return { matched:true, siren:res.siren||'', siret:siege.siret||'',
        denomination:res.nom_complet||res.nom_raison_sociale||'',
        dateCreation:siege.date_creation||res.date_creation||'',

        fetchedAt:new Date().toISOString() };
    }

      const t=((c&&c.name)||'')+' '+((c&&c.category)||d.category||'')+' '+(d.primaryType||'');
      const s=t.toLowerCase();
      const map=[
        [/camping|campground|rv[_ ]?park|holiday[_ ]?park|mobil.?home|mobilhome|caravan|bungalow|village.?vacances/,['camping','location mobil-home','où dormir en camping']],
        [/resort/,['hébergement','village vacances','où dormir']],

        [/spa|wellness|massage|beaut/,['institut de beauté','spa','soin du visage']],
        [/plumb|plomb/,['plombier','dépannage plomberie']],
        [/electric|électric/,['électricien','dépannage électrique']],

        [/garage|car_repair|auto|m[ée]can/,['garage auto','réparation voiture','garagiste']],

        [/fleuri|florist/,['fleuriste','livraison de fleurs']],
        [/store|shop|market|boutique|commerce/,['boutique','magasin']]
      ];
      let base=[]; for(const [rx,ks] of map){ if(rx.test(s)){ base=ks; break; } }
      if(!base.length){ const cat=String((c&&c.category)||d.category||'').trim(); base=[cat&&cat.toLowerCase()!=='autre'?cat.toLowerCase():'commerce']; }
      const b0=base[0];

    function socialVisibility(a){

    async function fetchPagespeed(site){
      const key=String((appSettings&&appSettings.pagespeed_api_key)||'').trim();
      const u=new URL('https://www.googleapis.com/pagespeedonline/v5/runPagespeed');
      u.searchParams.set('url',site); u.searchParams.set('strategy','mobile');
      ['performance','accessibility','best-practices','seo'].forEach(cat=>u.searchParams.append('category',cat));
      u.searchParams.set('locale','fr'); if(key) u.searchParams.set('key',key);
      const r=await withTimeout(fetch(u.toString()),60000);
      if(!r.ok){ if(key&&(r.status===400||r.status===401||r.status===403)) keyStoreSet('pagespeed',false,key); const dd=await r.json().catch(()=>null); const m=(dd&&dd.error&&dd.error.message)||('HTTP '+r.status); throw new Error(r.status===429?'quota PageSpeed atteint':r.status===400?'adresse non analysable':m); }
      const data=await r.json(); const lh=data.lighthouseResult; if(key) keyStoreSet('pagespeed',true,key);
      if(!lh||!lh.categories) throw new Error('aucun résultat Lighthouse');
      const sc=k=>typeof (lh.categories[k]||{}).score==='number'?Math.round(lh.categories[k].score*100):null;
      const au=lh.audits||{}; const dv=k=>(au[k]&&au[k].displayValue)||null;
      const cleanTxt=t=>String(t||'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/\s+/g,' ').trim();
      const recommendations=Object.values(au).filter(x=>x&&typeof x.score==='number'&&x.score<0.9&&x.title&&(x.scoreDisplayMode==='metricSavings'||(x.details&&x.details.type==='opportunity')||x.scoreDisplayMode==='binary'||x.scoreDisplayMode==='numeric')).sort((x,y)=>x.score-y.score).slice(0,8).map(x=>({title:cleanTxt(x.title),detail:cleanTxt(x.description),gain:x.displayValue||null,severity:x.score<0.5?'haute':'moyenne'}));
      return { provider:'Google PageSpeed Insights · Lighthouse (mobile)', analyzedAt:new Date().toISOString(), url:site, finalUrl:lh.finalDisplayedUrl||site, scores:{performance:sc('performance'),accessibility:sc('accessibility'),bestPractices:sc('best-practices'),seo:sc('seo')}, metrics:{ 'Contenu affiché (FCP)':dv('first-contentful-paint'), 'Plus grand contenu (LCP)':dv('largest-contentful-paint'), 'Interactivité (TBT)':dv('total-blocking-time'), 'Stabilité visuelle (CLS)':dv('cumulative-layout-shift'), 'Vitesse (Speed Index)':dv('speed-index') }, recommendations };
    }

      const shown=Math.min(100,Math.round(fullAuditState.pct));

      const pc=el.querySelector('[data-ap-pct]'); if(pc) pc.textContent=shown+'%';

      const eta=el.querySelector('[data-ap-eta]'); if(eta){ const elapsed=(Date.now()-fullAuditState.startedAt)/1000; const rem=Math.max(0,Math.round(fullAuditState.estTotal-elapsed)); eta.textContent=(fullAuditState.pct>=99?'finalisation…':(rem>0?'≈ '+rem+' s restantes':'presque terminé…')); }

    function visibilityAudit(a,c){
      const d=(c&&c.details)||{}; const s=a&&a.scan; const si=a&&a.site;
      const site=String((c&&c.website)||d.website||'').trim();
      const secure=/^https:\/\//i.test(site);
      const rating=(d.rating!=null)?Number(d.rating):null;
      const reviews=Number(d.reviews||0);
      const phone=String((c&&c.phone)||d.phone||'').trim();
      const hasGoogle=!!(d.place_id||d.address||rating!=null);
      const hours=!!(Array.isArray(d.hours)&&d.hours.length);
      const perf=(s&&s.scores)?s.scores.performance:null;
      const seoLh=(s&&s.scores)?s.scores.seo:null;
      const ns=si?(si.socials||[]).length:0;
      const majorNets=['Instagram','Facebook','TikTok','YouTube'];
      const major=si?(si.socials||[]).filter(x=>majorNets.includes(x.net)).length:0;
      const tier=(v,stops)=>{ for(const st of stops){ if(v>=st[0]) return st[1]; } return 0; };
      const items=[];
      // Notation graduée : 'val' entre 0 et 1 (crédibilité), 'ok' = point fort affiché.
      const add=(pillar,label,ok,weight,bad,good,val)=>{ const v=(val==null?(ok?1:0):val); items.push({pillar,label,ok,weight,advice:ok?good:bad,gap:bad,val:Math.max(0,Math.min(1,v))}); };
      /* ---- SEO : être trouvé quand on cherche sur Google ---- */
      add('seo','Fiche Google Business',hasGoogle,18,'Créer ou revendiquer la fiche Google Business Profile : sans elle, le commerce est quasi invisible dans les recherches locales et sur Maps.','Fiche Google présente et renseignée.');
      add('seo','Site web',!!site,16,'Aucun site web : impossible d’être bien référencé. Une vitrine (services, coordonnées, horaires) est la base.','Le commerce dispose d’un site web.');
      if(site) add('seo','Site sécurisé (HTTPS)',secure,4,'Le site n’est pas en HTTPS : les navigateurs le signalent comme « non sécurisé », ce qui nuit au référencement et à la confiance.','Site sécurisé en HTTPS.');
      if(rating!=null){ const rv=tier(rating,[[4.6,1],[4.2,0.9],[4.0,0.8],[3.5,0.55],[3.0,0.3],[0,0.15]]); add('seo','Note Google',rating>=4.0,10,'Note Google sous 4/5 : elle pèse sur le classement local. Répondre aux avis et solliciter les clients satisfaits.','Bonne note Google ('+rating+'/5).',rv); }

    async function exportReport(auditId, mode){
      if(pdfBusy) return;
      const a=appAudits.find(x=>x.id===auditId);

      const c=appClients.find(x=>x.id===a.client_id);
      mode=(mode==='simple')?'simple':'full';
      pdfBusy=true;pdfCancelled=false;appNotice='';renderApp();
      try{
        await ensureJsPdf();
        if(pdfCancelled) return;
        const jsPDFctor=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
        const pdf=new jsPDFctor('p','mm','a4');
        if(mode==='simple') buildPdfSimple(pdf,a,c); else buildPdfFull(pdf,a,c);
        if(pdfCancelled) return;
        const base=((mode==='simple'?'Rapport-express-':'Rapport-complet-')+((c&&c.name)||'commerce')).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'');
        const fname=base+'.pdf';

    function showPdfResult(blob,fname){
      let url; try{ url=URL.createObjectURL(blob); }catch(_){ appNotice='PDF prêt mais impossible à ouvrir ici.'; renderApp(); return; }
      const ov=document.createElement('div'); ov.className='pdf-result';
      let canShareFiles=false; try{ canShareFiles=!!(navigator.canShare&&navigator.canShare({files:[new File([blob],fname,{type:'application/pdf'})]})); }catch(_){ canShareFiles=false; }
      ov.innerHTML='<div class="pdf-result-card"><div class="pdf-result-ic">📄</div><b>Votre rapport est prêt</b><p class="pdf-result-name">'+escHtml(fname)+'</p>'
        +(canShareFiles?'<button class="pdf-result-btn primary" data-share>Enregistrer / Partager le PDF</button>':'')
        +'<a class="pdf-result-btn'+(canShareFiles?'':' primary')+'" href="'+url+'" target="_blank" rel="noopener" download="'+escHtml(fname)+'">Ouvrir le PDF</a>'
        +'<button class="pdf-result-btn ghost" data-close>Fermer</button>'
        +'<span class="pdf-result-tip">Sur iPhone : touche « Enregistrer / Partager » puis « Enregistrer dans Fichiers ». Sinon « Ouvrir le PDF », puis le bouton Partager de Safari.</span></div>';
      document.body.appendChild(ov);
      const cleanup=()=>{ try{ov.remove();}catch(_){}; setTimeout(()=>{try{URL.revokeObjectURL(url);}catch(_){}},60000); };
      ov.addEventListener('click',e=>{ if(e.target===ov) cleanup(); });
      const closeBtn=ov.querySelector('[data-close]'); if(closeBtn) closeBtn.addEventListener('click',cleanup);
      const shareBtn=ov.querySelector('[data-share]');
      if(shareBtn) shareBtn.addEventListener('click',async()=>{ try{ const file=new File([blob],fname,{type:'application/pdf'}); await navigator.share({files:[file],title:fname}); }catch(err){ if(err&&err.name!=='AbortError'){ try{ window.open(url,'_blank'); }catch(_){} } } });
    }

uton ouvre la page officielle pour créer une clé ou accéder au service. Suis les étapes, colle la clé ici puis enregistre.</p></div></div><div class="api-overview"><div class="api-overview-item"><strong>01</strong><span>Ouvrir la console</span></div><div class="api-overview-item"><strong>02</strong><span>Créer et restreindre la clé</span></div><div class="api-overview-item"><strong>03</strong><span>Coller puis enregistrer</span></div></div><div class="api-security-note"><b>Sécurité :</b> limite chaque clé aux API et domaines nécessaires. Les clés OpenAI et autres secrets serveur ne doivent pas être exposés dans le navigateur ; leur activation exige un stockage serveur sécurisé.</div><h3 style="margin:18px 0 4px;font-size:15px;font-weight:800">Connexions actives</h3><p class="field-help" style="margin:0 0 10px">Ces trois services alimentent réellement les audits : logos, recherche de commerces, analyse de performance.</p><div class="integration-group logo-dev-group"><div class="integration-head"><div><b>Logo.dev — logos des marques et réseaux</b><small>Affiche les logos officiels des plateformes et des entreprises dans les dossiers d’audit.</small></div>'+keyBadge("logo_dev","Clé publique")+'</div><label>Clé publishable Logo.dev<div class="integration-key"><input name="logo_dev_publishable_key" type="password" autocomplete="off" value="'+escHtml(st.logo_dev_publishable_key||'')+'" placeholder="pk_…"><button class="reveal-key" type="button" data-reveal>Afficher</button></div></label><p class="field-help">Utilise la clé publishable (souvent préfixée par pk_), prévue pour les images côté navigateur. Ne colle pas une clé secrète sk_ ici.</p><div class="api-actions"><a class="api-link" href="https://www.logo.dev/" target="_blank" rel="noopener noreferrer">Créer une clé Logo.dev ↗</a><a class="api-link" href="https://www.logo.dev/products/logo-api" target="_blank" rel="noopener noreferrer">Voir la documentation ↗</a></div>'+testRow("logo_dev")+'<p class="field-help">Une fois enregistrée, elle affiche les logos. Elle ne détecte pas à elle seule les comptes sociaux d’un commerce.</p></div><div class="integration-group"><div class="integration-head"><div><b>Google Places API</b><small>Recherche et détails des commerces : nom, adresse, catégorie, téléphone selon disponibilité.</small></div>'+keyBadge("places","À configurer")+'</div><label>Clé API Places<div class="integration-key"><input name="google_places_api_key" type="password" autocomplete="off" value="'+escHtml(st.google_places_api_key||'')+'" placeholder="AIza…"><button class="reveal-key" type="button" data-reveal>Afficher</button></div></label><p class="field-help">Active Places API (New) et restreins la clé par référent HTTP à l’adresse GitHub Pages d’AuditIA.</p><div class="api-actions"><a class="api-link" href="https://console.cloud.google.com/apis/library/places.googleapis.com" target="_blank" rel="noopener noreferrer">Créer / configurer la clé Google Places ↗</a></div>'+testRow("places")+'</div><div class="integration-group"><div class="integration-head"><div><b>PageSpeed Insights</b><small>Performance mobile/desktop et indicateurs Core Web Vitals.</small></div>'+keyBadge("pagespeed","À configurer")+'</div><label>Clé API PageSpeed<input name="pagespeed_api_key" type="password" autocomplete="off" value="'+escHtml(st.pagespeed_api_key||'')+'" placeholder="Clé PageSpeed (facultative)"></label><p class="field-help">Clé facultative : sans elle, l’analyse fonctionne mais avec un quota limité. Avec une clé, tu peux lancer davantage d’audits réels.</p><div class="api-actions"><a class="api-link" href="https://console.cloud.google.com/apis/library/pagespeedonline.googleapis.com" target="_blank" rel="noopener noreferrer">Activer PageSpeed Insights ↗</a></div>'+testRow("pagespeed")+'</div><details class="add-toggle" style="margin-top:12px"><summary>Autres intégrations — bientôt disponibles</summary><div style="padding:14px 14px 4px"><p class="field-help" style="margin:0 0 12px">Ces services demandent une connexion OAuth ou un serveur sécurisé. Ils ne sont pas encore actifs dans les audits ; les champs sont conservés pour plus tard.</p><div class="integration-group"><div class="integration-head"><div><b>Google Maps</b><small>Carte et localisation des commerces.</small></div>'+keyBadge("maps","À configurer")+'</div><label>Clé API Maps JavaScript<input name="google_maps_api_key" type="password" autocomplete="off" value="'+escHtml(st.google_maps_api_key||'')+'" placeholder="Clé Google Maps"></label><p class="field-help">La localisation d’un commerce s’ouvre déjà dans Google Maps sans clé. Une clé ne sert qu’à afficher une carte intégrée plus tard.</p><div class="api-actions"><a class="api-link" href="https://console.cloud.google.com/apis/library/maps-javascript.googleapis.com" target="_blank" rel="noopener noreferrer">Configurer Google Maps ↗</a></div>'+testRow("maps")+'</div><div class="integration-group"><div class="integration-head"><div><b>Google Search Console</b><small>Suivi SEO, clics et impressions avec autorisation du propriétaire du site.</small></div>'+keyBadge("search_console","Connexion OAuth à prévoir")+'</div><label>Propriété du site<input name="search_console_property" value="'+escHtml(st.search_console_property||'')+'" placeholder="https://exemple.fr/ ou sc-domain:exemple.fr"></label><p class="field-help">Une propriété seule ne donne pas accès aux données. Une connexion OAuth Google sera nécessaire.</p><div class="api-actions"><a class="api-link" href="https://search.google.com/search-console" target="_blank" rel="noopener noreferrer">Ouvrir Google Search Console ↗</a></div>'+testRow("search_console")+'</div><div class="integration-group"><div class="integration-head"><div><b>Google Business Profile</b><small>Fiche établissement et présence locale.</small></div>'+keyBadge("business","Connexion à prévoir")+'</div><label>URL de la fiche (facultative)<input name="google_business_profile_url" value="'+escHtml(st.google_business_profile_url||'')+'" placeholder="Lien de la fiche Google"></label><p class="field-help">L’accès aux données privées nécessite une autorisation Google appropriée ; le lien seul ne suffit pas.</p><div class="api-actions"><a class="api-link" href="https://business.google.com/" target="_blank" rel="noopener noreferrer">Ouvrir Google Business Profile ↗</a></div>'+testRow("business")+'</div><div class="integration-group"><div class="integration-head"><div><b>Bing Webmaster Tools</b><small>Référencement et données de visibilité Bing.</small></div>'+keyBadge("bing","À configurer")+'</div><label>Clé API Bing<input name="bing_webmaster_api_key" type="password" autocomplete="off" value="'+escHtml(st.bing_webmaster_api_key||'')+'" placeholder="Clé Bing Webmaster"></label><div class="api-actions"><a class="api-link" href="https://www.bing.com/webmasters/" target="_blank" rel="noopener noreferrer">Ouvrir Bing Webmaster Tools ↗</a></div>'+testRow("bing")+'</div><div class="integration-group"><div class="integration-head"><div><b>IA — rapports et recommandations</b><small>Préparer des synthèses et recommandations d’audit assistées par IA.</small></div>'+keyBadge("openai","Serveur requis")+'</div><label>Clé API OpenAI<input name="openai_api_key" type="password" autocomplete="off" value="'+escHtml(st.openai_api_key||'')+'" placeholder="À ne pas exposer côté navigateur"></label><p class="field-help">Ne pas utiliser directement cette clé depuis le navigateur en production. Elle doit être déplacée dans un secret Supabase Edge Function avant activation.</p><div class="api-actions"><a class="api-link" href="https://platform.openai.com/api-keys" target="_blank" rel="noopener noreferrer">Créer une clé OpenAI ↗</a></div>'+testRow("openai")+'</div><label>Notes d’intégration<textarea name="integrations_notes" placeholder="Projet Google Cloud, API activées, tâches restantes…">'+escHtml(st.integrations_notes||'')+'</textarea></label></div></details><div class="integration-actions"><button class="app-btn" type="button" data-reveal-all>Afficher/masquer les clés</button><button class="app-btn" type="button" data-clear-api-keys>Effacer les champs API</button></div></section><div class="settings-actions" style="margin-top:14px"><button class="app-btn primary" type="submit">Enregistrer les paramètres</button><button class="app-btn" type="button" data-app-action="refresh">Annuler les modifications</button></div><p class="app-muted">Un seul bouton « Enregistrer » conserve tout : identité, signature, apparence et clés API.</p></form>';
      } else if(appView==='Détail'){
        const a=appAudits.find(x=>x.id===activeAudit);
        if(!a){appView='Audits';renderApp();return}
        const c=appClients.find(x=>x.id===a.client_id);
        const list=Array.isArray(a.checklist)?a.checklist:[];
        const analyzed=!!(a.site||a.scan||a.status==='Analysé');
        const diagBlocks=analyzed?(visibilitySummaryHtml(a,c)+clientInfoHtml(c)+siteShotHtml(a)+scanPanelHtml(a,c)+socialPresenceHtml(a)+rankingsHtml(a)+competitorsHtml(a,c)+targetingPanelHtml(a,c)+improvementHtml(a,c)+'<details class="cd-edit" style="margin-top:14px"><summary>Notes personnelles (facultatif)</summary><form class="app-form" data-save-notes style="padding:0 16px 16px"><label>Notes internes<textarea name="notes" placeholder="Remarques pour toi — n’apparaissent dans le rapport que si tu les remplis.">'+escHtml(a.notes||'')+'</textarea></label><button class="app-btn primary" type="submit">Enregistrer les notes</button></form></details><div class="detail-actions" style="margin-top:16px;flex-wrap:wrap"><button class="app-btn" data-export-report="'+a.id+'" data-mode="simple">📄 Rapport express (1 page · gratuit)</button><button class="app-btn primary" data-export-report="'+a.id+'" data-mode="full">📑 Rapport complet (PDF)</button><button class="app-btn" data-delete-audit="'+a.id+'">Supprimer cet audit</button></div><p class="app-muted" style="margin:8px 0 0;font-size:12px">Le <b>rapport express</b> est l’aperçu gratuit à laisser au prospect ; le <b>rapport complet</b> est le document détaillé que tu peux facturer.</p>'):'<div class="app-panel" style="margin-top:14px"><div class="app-empty">Rien n’est encore analysé. Touche <b>⚡ Analyser le commerce</b> ci-dessus : AuditIA récupère les données Google, lit le site, trouve les réseaux, les informations légales (SIRET) et la performance, puis génère le rapport complet.</div><div class="detail-actions" style="margin-top:14px"><button class="app-btn" data-delete-audit="'+a.id+'">Supprimer cet audit</button></div></div>';
        body='<button class="app-btn" data-app-view="Audits">← Retour aux audits</button><section class="app-panel" style="margin-top:14px"><div class="eyebrow">DOSSIER D’AUDIT</div><h2 style="margin-top:8px">'+escHtml(c?.name||'Commerce')+'</h2><p>'+escHtml(c?.city||'')+' · '+escHtml(a.title)+'</p>'+analysePanelHtml(a,c)+diagBlocks+'</section>';
      }
      appShell(body);
    }
    async function openWorkspace(client,user){
      appClient=client;appUser=user;
      if(!user||String(user.email||'').toLowerCase()!==ADMIN_EMAIL){await client.auth.signOut();throw new Error('Ce compte n’est pas autorisé à accéder à AuditIA.')}
      await refreshData();appView='Accueil';activeAudit=null;appNotice='';renderApp();
      void checkKeysHealth();
    }
    /* ----- écrans de connexion (rendus dans #authRoot) ----- */
    const authRoot = document.getElementById('authRoot');
    const EYE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    const BRAND = '<a class="login-brand" href="./" aria-label="AuditIA accueil"><span class="login-mark" aria-hidden="true">A<span>✓</span></span><span class="login-wordmark">Audit<span style="color:#f28b46">IA</span></span></a>';
    const FOOT = '<p class="login-foot">AuditIA · Auditer mieux, décider plus clairement</p><p class="login-status">Connexion sécurisée via Supabase</p>';
    const pwdField = (id,label,ac) => '<label class="login-field" for="'+id+'"><span>'+label+'</span><span class="password-wrap"><input class="login-control" id="'+id+'" type="password" autocomplete="'+ac+'" required minlength="8"><button class="toggle-password" type="button" data-showpwd="'+id+'" aria-label="Afficher le mot de passe" title="Afficher le mot de passe">'+EYE+'</button></span></label>';
    const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
    const pwdIssue = p => p.length<8 ? '8 caractères minimum.' : (!/[A-Za-zÀ-ÿ]/.test(p)||!/\d/.test(p)) ? 'au moins une lettre et un chiffre.' : p.length>72 ? '72 caractères maximum.' : '';
    function authError(e){
      const m=((e&&(e.message||e.error_description))||'').toLowerCase(), st=e&&e.status;
      if(st===429||m.includes('rate limit')||m.includes('too many')) return 'Trop de tentatives. Patientez quelques minutes avant de réessayer.';
      if(m.includes('invalid login')) return 'E-mail ou mot de passe incorrect.';
      if(m.includes('email not confirmed')) return 'Votre adresse e-mail n’est pas encore confirmée. Ouvrez le lien reçu par e-mail.';
      if(m.includes('same password')||m.includes('different from the old')) return 'Choisissez un mot de passe différent de l’ancien.';
      if(m.includes('password')&&(m.includes('weak')||m.includes('at least')||m.includes('should'))) return 'Mot de passe trop faible : 8 caractères minimum, avec au moins une lettre et un chiffre.';
      if(m.includes('fetch')||m.includes('network')) return 'Connexion impossible. Vérifiez votre réseau internet.';
      return 'Une erreur est survenue. Réessayez.';
    }
    function setMsg(txt,kind){const el=document.getElementById('authMsg');if(!el)return;el.textContent=txt||'';el.className='login-message'+(txt?(kind==='ok'?' success':' error'):'');}
    function busy(btn,on,label){if(!btn)return;btn.disabled=on;if(on){btn.dataset.l=btn.textContent;btn.textContent=label||'Veuillez patienter…';}else if(btn.dataset.l){btn.textContent=btn.dataset.l;}}
    const val = id => (document.getElementById(id)?.value||'').trim();

    function renderAuth(mode){
      let card='';
      if(mode==='forgot'){
        card='<section class="login-card"><h1>Mot de passe oublié</h1><p class="login-subtitle">Indiquez votre adresse : vous recevrez un lien sécurisé pour choisir un nouveau mot de passe.</p>'
          +'<form id="fForgot" novalidate><label class="login-field" for="foEmail"><span>Adresse e-mail</span><input class="login-control" id="foEmail" type="email" inputmode="email" autocomplete="username" placeholder="vous@exemple.fr" required></label>'
          +'<button class="login-submit" type="submit">Envoyer le lien</button><div class="login-message" id="authMsg" role="status" aria-live="polite"></div></form></section>'
          +'<p class="login-create"><button type="button" data-go="signin">← Retour à la connexion</button></p>';
      } else if(mode==='reset'){
        card='<section class="login-card"><h1>Nouveau mot de passe</h1><p class="login-subtitle">Choisissez un nouveau mot de passe pour votre compte AuditIA.</p>'
          +'<form id="fReset" novalidate>'+pwdField('rPwd','Nouveau mot de passe','new-password')+pwdField('rPwd2','Confirmer le mot de passe','new-password')
          +'<p class="login-hint">8 caractères minimum, avec au moins une lettre et un chiffre.</p>'
          +'<button class="login-submit" type="submit">Enregistrer</button><div class="login-message" id="authMsg" role="status" aria-live="polite"></div></form></section>';
      } else if(mode==='expired'){
        card='<section class="login-card"><h1>Lien expiré</h1><p class="login-subtitle">Ce lien n’est plus valable : il a expiré ou a déjà été utilisé. Demandez-en un nouveau, ou connectez-vous si vous avez déjà un mot de passe.</p>'
          +'<button class="login-submit" type="button" data-go="forgot">Recevoir un nouveau lien</button>'
          +'<button class="login-reset" type="button" data-go="signin">Retour à la connexion</button></section>';
      } else {
        card='<section class="login-card"><h1>Connexion</h1><p class="login-subtitle">Retrouvez vos audits et votre espace de travail.</p>'
          +'<form id="fSignin" novalidate><label class="login-field" for="siEmail"><span>Adresse e-mail</span><input class="login-control" id="siEmail" type="email" inputmode="email" autocomplete="username" placeholder="vous@exemple.fr" required></label>'
          +pwdField('siPwd','Mot de passe','current-password')
          +'<button class="login-submit" type="submit">Se connecter</button><button class="login-reset" type="button" data-go="forgot">Mot de passe oublié ?</button>'
          +'<div class="login-message" id="authMsg" role="status" aria-live="polite"></div></form></section>';
      }
      authRoot.innerHTML = BRAND + card + FOOT;
      window.scrollTo(0,0);
      const first = authRoot.querySelector('input'); if(first) setTimeout(()=>first.focus(),60);
    }

    let loginFails=0, loginLockUntil=0;
    async function doSignin(e){
      e.preventDefault();
      const btn=e.target.querySelector('.login-submit');
      const email=val('siEmail').toLowerCase(), pwd=document.getElementById('siPwd').value;
      if(Date.now()<loginLockUntil){setMsg('Trop d’essais. Réessayez dans '+Math.ceil((loginLockUntil-Date.now())/1000)+' secondes.');return;}
      if(!validEmail(email)){setMsg('Saisissez une adresse e-mail valide.');return;}
      if(!pwd){setMsg('Saisissez votre mot de passe.');return;}
      busy(btn,true,'Connexion…'); setMsg('');
      const {data,error}=await sb.auth.signInWithPassword({email,password:pwd});
      busy(btn,false);
      if(error){ loginFails++; if(loginFails>=5){loginLockUntil=Date.now()+60000;loginFails=0;} setMsg(authError(error)); return; }
      if(email!==ADMIN_EMAIL){ await sb.auth.signOut(); setMsg('Ce compte n’est pas autorisé à accéder à AuditIA.'); return; }
      loginFails=0;
      try{ await openWorkspace(sb,data.user); }catch(err){ setMsg(err&&err.message||'Connexion impossible.'); }
    }
    async function doForgot(e){
      e.preventDefault();
      const btn=e.target.querySelector('.login-submit');
      const email=val('foEmail').toLowerCase();
      if(!validEmail(email)){setMsg('Saisissez une adresse e-mail valide.');return;}
      busy(btn,true,'Envoi…'); setMsg('');
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:REDIRECT_URL});
      busy(btn,false);
      if(error&&(error.status===429||/rate/i.test(error.message||''))){ setMsg(authError(error)); return; }
      setMsg('Si un compte existe avec cette adresse, un e-mail vient d’être envoyé. Pensez à regarder dans les indésirables.','ok');
    }
    async function doReset(e){
      e.preventDefault();
      const btn=e.target.querySelector('.login-submit');
      const p=document.getElementById('rPwd').value, p2=document.getElementById('rPwd2').value;
      const pi=pwdIssue(p); if(pi){setMsg('Mot de passe trop faible : '+pi);return;}
      if(p!==p2){setMsg('Les deux mots de passe ne sont pas identiques.');return;}
      busy(btn,true,'Enregistrement…'); setMsg('');
      const {error}=await sb.auth.updateUser({password:p});
      busy(btn,false);
      if(error){ setMsg(authError(error)); return; }
      setMsg('Mot de passe modifié.','ok');
      try{ const {data}=await sb.auth.getUser(); if(data&&data.user){ await openWorkspace(sb,data.user); return; } }catch(err){}
      renderAuth('signin'); setMsg('Mot de passe modifié. Vous pouvez vous connecter.','ok');
    }

    authRoot.addEventListener('click', e=>{
      const go=e.target.closest('[data-go]'); if(go){ renderAuth(go.dataset.go); return; }
      const sp=e.target.closest('[data-showpwd]');
      if(sp){ const inp=document.getElementById(sp.dataset.showpwd); if(inp){ const show=inp.type==='password'; inp.type=show?'text':'password'; sp.setAttribute('aria-label',show?'Masquer le mot de passe':'Afficher le mot de passe'); } }
    });
    authRoot.addEventListener('submit', e=>{
      if(e.target.id==='fSignin') doSignin(e);
      else if(e.target.id==='fForgot') doForgot(e);
      else if(e.target.id==='fReset') doReset(e);
    });

    let recoveryShown=false;
    function showAuthLoading(){ authRoot.innerHTML = BRAND + '<section class="login-card auth-loading"><div class="auth-spinner" aria-hidden="true"></div><p class="login-subtitle" style="margin:0">Ouverture de votre espace…</p></section>' + FOOT; }
    async function boot(){
      showAuthLoading();
      await getClient();
      const hp=new URLSearchParams(location.hash.slice(1)), qp=new URLSearchParams(location.search);
      const linkType=hp.get('type')||qp.get('type')||'';
      const linkErr=hp.get('error_code')||qp.get('error_code')||hp.get('error')||qp.get('error')||'';
      sb.auth.onAuthStateChange(ev=>{ if(ev==='PASSWORD_RECOVERY'&&!recoveryShown){ recoveryShown=true; renderAuth('reset'); } });
      let session=null;
      try{ const {data}=await sb.auth.getSession(); session=data.session; }catch(err){}
      const dirty=/access_token|refresh_token|error|type=/.test(location.hash+location.search);
      if(dirty && linkType!=='recovery') history.replaceState(null,'',location.pathname);
      if(linkErr){ renderAuth('expired'); return; }
      if(linkType==='recovery'){ recoveryShown=true; renderAuth('reset'); return; }
      if(session&&session.user){
        try{ await openWorkspace(sb,session.user); return; }
        catch(err){ renderAuth('signin'); setMsg(err&&err.message||'Connexion impossible.'); return; }
      }
      renderAuth('signin');
    }
    boot();
    if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }

  </script>
  <footer class="wrap foot"><span>© <span id="year"></span> AuditIA · AffiAds</span><span>Espace privé AuditIA · Paramètres synchronisés avec Supabase.</span></footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
