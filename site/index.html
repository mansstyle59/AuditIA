  <style>
    :root{color-scheme:dark;--bg:#0f0c1d;--panel:#19152b;--panel2:#211b37;--text:#f8f6ff;--muted:#b5aecb;--purple:#9a87ff;--orange:#ffad72;--line:#39304f}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#33236a 0,transparent 35%),radial-gradient(ellipse at 0% 45%,#241c48 0,transparent 35%),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    a{color:inherit}.wrap{width:min(1120px,100% - 40px);margin:auto}.top{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12}.brand{display:flex;align-items:center;gap:12px;text-decoration:none}.brand img{width:42px;height:42px}.brand strong{display:block;font-size:18px;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase}.toplink{font-size:13px;text-decoration:none;color:var(--muted)}

    .preview{border:1px solid #ffffff1c;border-radius:28px;background:linear-gradient(155deg,#211b37f2,#141022fa);padding:22px;box-shadow:0 35px 100px #03020a80;transform:rotate(1deg)}.preview-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}.badge{background:#203b34;color:#8de3bb;border:1px solid #305b4d;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:800}.scorebox{display:flex;align-items:center;gap:18px;margin:24px 0 21px}.gauge{width:98px;height:98px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--purple) 0 78%,#39304f 78%);position:relative}.gauge:before{content:"";position:absolute;inset:8px;background:#19152b;border-radius:50%}.gauge strong{position:relative;font-size:27px}.scoretext b{display:block;font-size:17px}.scoretext span{font-size:12px;color:var(--muted)}.metric{padding:14px 0;border-top:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;gap:12px}.metric span{font-size:13px;color:var(--muted)}.metric b{font-size:13px}.good{color:#8de3bb}.purple{color:#c3b7ff}.orange{color:var(--orange)}
    section{padding:45px 0 60px}.section-top{text-align:center;max-width:650px;margin:0 auto 30px}.eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--orange);font-weight:800}.section-top h2{font-size:clamp(27px,4vw,40px);line-height:1.1;letter-spacing:-1.5px;margin:12px 0}.section-top p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:1px solid var(--line);background:linear-gradient(145deg,#1b172cdd,#171326dd);padding:22px;border-radius:20px}.icon{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:#302553;color:#c8bcff;font-size:19px;margin-bottom:18px}.card h3{font-size:16px;margin:0 0 8px}.card p{font-size:13px;color:var(--muted);margin:0}.bottom{margin:25px 0 65px;display:flex;justify-content:space-between;align-items:center;gap:25px;border:1px solid #6c5abb66;border-radius:24px;padding:28px;background:linear-gradient(110deg,#28204a,#1d1733)}.bottom h2{margin:0 0 7px;font-size:24px}.bottom p{margin:0;color:var(--muted);font-size:13px}.foot{border-top:1px solid #ffffff13;color:#827a99;font-size:12px;padding:22px 0 32px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

    .login-page{min-height:calc(100svh - 148px);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:30px 0 26px}

    .auth-view-toggle{display:flex;justify-content:center;gap:14px;margin:0 0 26px;flex-wrap:wrap}.auth-view-toggle button{border:1px solid #dfdaef;background:#f6f4ff;color:#4c36c2;border-radius:999px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer}

    .workspace-app{width:min(1120px,100%);margin:0 auto;padding:10px 0 36px;color:var(--text)}
    .workspace-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:12px 0 22px}

    .sidebar-brand img{width:40px;height:40px;object-fit:contain;border-radius:12px;background:#302553;padding:4px}
    .sidebar-brand b{display:block;font-size:15px}.sidebar-brand small{color:var(--muted);font-size:10px;letter-spacing:1px}
    .sidebar-nav{display:grid;gap:5px}.sidebar-nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--muted);padding:12px;border-radius:12px;font-weight:750;cursor:pointer}

    .nav-icon{width:24px;text-align:center;font-size:17px}.sidebar-bottom{border-top:1px solid #ffffff14;margin-top:12px;padding:12px 6px 4px;color:var(--muted);font-size:11px}

/* AuditIA iPhone-first visual refresh, inspired by FormIA's restrained tab navigation */
.workspace-app{width:min(1240px,100%);margin:0 auto;padding:18px 18px 38px;color:var(--text)}
.workspace-layout{grid-template-columns:224px minmax(0,1fr);gap:22px}
.workspace-sidebar{top:18px;border:1px solid #ffffff12;border-radius:22px;background:#151222;padding:12px;box-shadow:none}
.sidebar-brand{padding:8px 8px 18px;margin-bottom:10px;border-bottom:1px solid #ffffff10}
.sidebar-brand img{width:42px;height:42px;border-radius:13px}
.sidebar-nav{gap:4px}
.sidebar-nav button{padding:12px 13px;border-radius:13px;font-size:14px;transition:background .16s,color .16s}
.sidebar-nav button.active{background:#2a2146;border-color:transparent;color:#c9baff}
.sidebar-nav button.active .nav-icon{color:#a38bff}
.nav-icon{font-size:19px;width:23px}
.workspace-head{padding:8px 2px 19px;margin:0 0 15px;border-bottom:1px solid #ffffff0d}
.workspace-head h1{font-size:clamp(26px,3vw,34px);font-weight:780;letter-spacing:-1.3px}
.workspace-head .eyebrow{font-size:10px;letter-spacing:1.6px;color:#a99bd5}
.workspace-head p{font-size:12px;color:#aaa3be}
.app-btn{border-radius:12px;background:#1b172b;border-color:#ffffff16;padding:10px 13px;font-size:13px;transition:background .15s,border-color .15s}
.app-btn:hover{background:#28213e;border-color:#8a78d855}
.app-btn.primary{background:#7054e8;color:#fff;box-shadow:none}
.app-nav{display:none}
.app-stats{gap:11px;margin:14px 0 16px}
.app-stat,.app-panel{background:#171425;border:1px solid #ffffff10;border-radius:19px;padding:18px;box-shadow:0 5px 20px #05030c12}
.app-stat span{font-size:12px;color:#aaa3be}
.app-stat strong{font-size:28px;letter-spacing:-.7px}
.app-panel h2{font-size:17px;letter-spacing:-.3px}
.app-panel p{line-height:1.55}

    async function initAuth(){
      try{
        const client=await getSupabase();
        const {data,error}=await client.auth.getSession();
        if(error)throw error;
        if(data.session?.user){await openWorkspace(client,data.session.user)}
      }catch(err){if(err?.message)announce(err.message,'error')}
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!emailInput.reportValidity()) return;
      if (mode !== 'reset' && !passwordInput.reportValidity()) return;
      submit.disabled = true;
      const oldLabel = submit.textContent;
      submit.textContent = 'Veuillez patienter…';
      announce('');
      try {
        const supabase = await getSupabase();
        const email = emailInput.value.trim();
        let result;
        if (mode === 'signin') {
          result = await supabase.auth.signInWithPassword({ email, password: passwordInput.value });
          if (!result.error && email.toLowerCase() !== 'dewulf.denis@gmail.com') {
            await supabase.auth.signOut();
            throw new Error('Ce compte n’est pas autorisé à accéder à l’espace administrateur AuditIA.');
          }
          if (!result.error) {
            await openWorkspace(supabase, result.data.user);
          }
        } else if (mode === 'signup') {
          result = await supabase.auth.signUp({ email, password: passwordInput.value, options: { emailRedirectTo: 'https://mansstyle59.github.io/AuditIA/' } });
          if (!result.error) announce('Demande envoyée. Vérifiez votre e-mail pour confirmer votre compte.', 'success');
        } else {
          result = await supabase.auth.resetPasswordForEmail(email, { redirectTo: 'https://mansstyle59.github.io/AuditIA/' });
          if (!result.error) announce('Si cette adresse est connue, un e-mail de réinitialisation va être envoyé.', 'success');
        }
        if (result?.error) throw result.error;
      } catch (err) {
        announce(err instanceof Error ? err.message : 'Connexion impossible. Vérifiez vos informations et réessayez.', 'error');
      } finally {
        submit.disabled = false;
        submit.textContent = oldLabel;
      }
    });
    initAuth();

  </script>
